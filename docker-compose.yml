# Site Selah en local : http://localhost:8080
#   docker compose up -d
#   WP="docker compose run --rm -T cli wp" ./scripts/installer.sh
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: selah
      MARIADB_USER: selah
      MARIADB_PASSWORD: selah
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: selah
      WORDPRESS_DB_USER: selah
      WORDPRESS_DB_PASSWORD: selah
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/themes/selah:/var/www/html/wp-content/themes/selah
      - ./wp-content/plugins/selah-core:/var/www/html/wp-content/plugins/selah-core

  # WP-CLI, lancé à la demande : docker compose run --rm cli wp …
  cli:
    image: wordpress:cli-php8.3
    profiles: ["outils"]
    user: "33:33"
    depends_on:
      - db
      - wordpress
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: selah
      WORDPRESS_DB_USER: selah
      WORDPRESS_DB_PASSWORD: selah
    volumes:
      - wordpress:/var/www/html
      - ./wp-content/themes/selah:/var/www/html/wp-content/themes/selah
      - ./wp-content/plugins/selah-core:/var/www/html/wp-content/plugins/selah-core

volumes:
  db:
  wordpress:
