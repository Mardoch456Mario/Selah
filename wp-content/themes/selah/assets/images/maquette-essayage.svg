<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740" role="img" aria-labelledby="titre desc">
  <title id="titre">Selah sur téléphone</title>
  <desc id="desc">Un personnage essaie une robe aux bandes safran ; trois amis ont donné leur avis.</desc>
  <defs>
    <!-- Hanken Grotesk réduite aux lettres de la maquette : une image SVG ne peut pas charger les polices du site. Licence SIL OFL. -->
    <style>@font-face{font-family:"Hanken Grotesk";font-weight:100 900;src:url(data:font/woff2;base64,) format("woff2");}</style>
    <clipPath id="robe">
      <path d="M180 206c-22 0-40 5-52 16l-34 104 28 8 18-46-16 152c38 10 74 10 112 0l-16-152 18 46 28-8-34-104c-12-11-30-16-52-16z"/>
    </clipPath>
    <clipPath id="ecran">
      <rect x="20" y="20" width="320" height="700" rx="38"/>
    </clipPath>
  </defs>

  <!-- Téléphone -->
  <rect x="8" y="8" width="344" height="724" rx="48" fill="#0b0b0c"/>
  <rect x="20" y="20" width="320" height="700" rx="38" fill="#ffffff"/>

  <g clip-path="url(#ecran)" font-family="'Hanken Grotesk', Arial, sans-serif">
    <rect x="140" y="30" width="80" height="22" rx="11" fill="#0b0b0c"/>

    <!-- Barre du haut -->
    <text x="40" y="92" font-size="24" font-weight="800" letter-spacing="-0.6" fill="#0b0b0c">Selah</text>
    <circle cx="276" cy="84" r="12" fill="#c9922a" stroke="#fff" stroke-width="3"/>
    <circle cx="294" cy="84" r="12" fill="#6b6b70" stroke="#fff" stroke-width="3"/>
    <circle cx="312" cy="84" r="12" fill="#0b0b0c" stroke="#fff" stroke-width="3"/>

    <!-- Scène d'essayage -->
    <rect x="36" y="110" width="288" height="372" rx="24" fill="#f3f3f2"/>
    <rect x="52" y="126" width="90" height="26" rx="13" fill="#ffffff"/>
    <circle cx="66" cy="139" r="4" fill="#c9922a"/>
    <text x="76" y="144" font-size="12" font-weight="600" fill="#0b0b0c">Essayage</text>
    <ellipse cx="180" cy="456" rx="78" ry="10" fill="#e4e4e2"/>

    <!-- Personnage -->
    <rect x="171" y="190" width="18" height="20" rx="6" fill="#7a4b2e"/>
    <circle cx="180" cy="176" r="25" fill="#7a4b2e"/>
    <path d="M153 170c-4-26 14-40 30-40 18 0 32 14 28 40-8-10-20-14-29-14-11 0-21 4-29 14z" fill="#c9922a"/>
    <circle cx="204" cy="140" r="10" fill="#c9922a"/>

    <path d="M180 206c-22 0-40 5-52 16l-34 104 28 8 18-46-16 152c38 10 74 10 112 0l-16-152 18 46 28-8-34-104c-12-11-30-16-52-16z" fill="#0b0b0c"/>
    <g clip-path="url(#robe)">
      <rect x="80" y="352" width="200" height="12" fill="#c9922a"/>
      <rect x="80" y="368" width="200" height="3" fill="#ffffff"/>
      <rect x="80" y="376" width="200" height="6" fill="#c9922a"/>
      <rect x="80" y="404" width="200" height="16" fill="#c9922a"/>
      <rect x="80" y="424" width="200" height="3" fill="#ffffff"/>
      <rect x="80" y="300" width="200" height="4" fill="#c9922a"/>
      <rect x="80" y="230" width="200" height="2" fill="#ffffff" fill-opacity=".35"/>
    </g>
    <path d="M168 206l12 18 12-18" stroke="#c9922a" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <circle cx="108" cy="338" r="9" fill="#7a4b2e"/>
    <circle cx="252" cy="338" r="9" fill="#7a4b2e"/>
    <rect x="160" y="438" width="14" height="16" rx="6" fill="#7a4b2e"/>
    <rect x="186" y="438" width="14" height="16" rx="6" fill="#7a4b2e"/>

    <!-- Avis d'un ami, en bulle -->
    <rect x="216" y="168" width="96" height="40" rx="20" fill="#ffffff"/>
    <circle cx="236" cy="188" r="10" fill="#c9922a"/>
    <text x="252" y="193" font-size="13" font-weight="700" fill="#0b0b0c">Oui !</text>
    <path d="M232 206l-8 12 18-10z" fill="#ffffff"/>

    <!-- Pièces à essayer -->
    <g>
      <rect x="36" y="498" width="64" height="64" rx="16" fill="#ffffff" stroke="#0b0b0c" stroke-width="2"/>
      <path d="M60 512h16l10 12-6 4v24H56v-24l-6-4z" fill="#0b0b0c"/>
      <rect x="56" y="536" width="24" height="4" fill="#c9922a"/>

      <rect x="110" y="498" width="64" height="64" rx="16" fill="#f3f3f2"/>
      <path d="M128 514h28l6 10-8 3v23h-24v-23l-8-3z" fill="#c9922a"/>

      <rect x="184" y="498" width="64" height="64" rx="16" fill="#f3f3f2"/>
      <path d="M204 512h24l2 40h-10l-4-26-4 26h-10z" fill="#6b6b70"/>

      <rect x="258" y="498" width="64" height="64" rx="16" fill="#f3f3f2"/>
      <path d="M274 538c0-12 8-20 16-20s16 8 16 20z" fill="#0b0b0c"/>
      <rect x="268" y="536" width="44" height="5" rx="2.5" fill="#0b0b0c"/>
    </g>

    <!-- Avis des amis -->
    <rect x="36" y="578" width="288" height="64" rx="18" fill="#ffffff" stroke="#e4e4e2"/>
    <circle cx="62" cy="610" r="12" fill="#c9922a" stroke="#fff" stroke-width="3"/>
    <circle cx="80" cy="610" r="12" fill="#6b6b70" stroke="#fff" stroke-width="3"/>
    <circle cx="98" cy="610" r="12" fill="#0b0b0c" stroke="#fff" stroke-width="3"/>
    <text x="120" y="605" font-size="13" font-weight="700" fill="#0b0b0c">3 amis ont donné</text>
    <text x="120" y="622" font-size="13" font-weight="700" fill="#0b0b0c">leur avis</text>
    <path d="M300 602c-3-5-11-4-11 2 0 5 6 9 11 13 5-4 11-8 11-13 0-6-8-7-11-2z" fill="#c9922a"/>

    <!-- Action principale -->
    <rect x="36" y="658" width="288" height="46" rx="23" fill="#0b0b0c"/>
    <text x="180" y="687" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Garder cette pièce</text>
  </g>
</svg>
